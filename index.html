<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sticker-sunflower.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdfa" />
    <title>Regala Flores 🌻 — Web Oficial & Guía de Personalización</title>
    <meta name="description" content="Plataforma interactiva multitemática para enviar regalos virtuales inolvidables. Guía oficial de uso, configuración de ocasiones, carta con sello de cera y música procedural Web Audio API." />
    <meta property="og:title" content="Regala Flores — Web Oficial & Guía de Personalización" />
    <meta property="og:description" content="Aprende a personalizar y enviar flores virtuales, dedicatorias con sello de cera y tarjetas para TikTok e Instagram Stories. 100% interactivo y libre de registros." />
    <meta property="og:image" content="/sticker-sunflower.png" />
    <meta property="og:url" content="https://flores.modlovelace.com" />
    <!-- Anti-flicker script para detección instantánea de tema (Día, Oscuro, Sistema) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('regala_flores_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0c0a09');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fuentes limpias editorial serif, sans y mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  </body>
